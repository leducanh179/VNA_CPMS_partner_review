name: cpms

services:
  postgres:
    image: postgres:16-alpine
    container_name: cpms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpms}
      POSTGRES_USER: ${POSTGRES_USER:-cpms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpms_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpms} -d ${POSTGRES_DB:-cpms}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - cpms_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups

volumes:
  cpms_postgres_data:
