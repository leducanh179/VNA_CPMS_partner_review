packages:
  - apps/*
  - packages/*

confirmModulesPurge: false

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true

# Temporary security override for CVE-2026-40345 until Prisma updates its exact pin.
overrides:
  deepmerge-ts: 8.0.2
